<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Budget Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="light-mode">

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">BudgetTracker</a>
            <button class="btn btn-outline-secondary ms-auto" id="darkModeToggle">Toggle Dark Mode</button>
        </div>
    </nav>

    <div class="d-flex" id="wrapper">
        <div class="sidebar border-end" id="sidebar">
            <div class="list-group list-group-flush mt-5">
                <a href="#" class="list-group-item list-group-item-action p-3 nav-link-custom"
                    onclick="loadPage('overview')">Overview</a>
                <a href="#" class="list-group-item list-group-item-action p-3 nav-link-custom"
                    onclick="loadPage('analytics')">Analytics</a>
            </div>
        </div>

        <div id="page-content-wrapper" class="w-100 mt-5 p-4">

            <div id="overview" class="content-section active-page fade-in">
                <h2 class="mb-4">Monthly Budget Summary</h2>

                <div class="row" id="budget-summary-container">
                </div>
            </div>

            <div id="analytics" class="content-section d-none fade-in">
                <h2 class="mb-4">Data Analytics</h2>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <canvas id="myChart" width="400" height="150"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
